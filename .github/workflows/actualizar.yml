name: Actualizar clima y noticias

on:
  # Argentina está siempre 3 horas detrás de UTC. Corre a las 6:17, 7:17 y 8:17 (por si GitHub
  # se saltea alguna a la mañana) y después a las 12:17, 15:17, 17:17 y 20:17 hs de Argentina.
  # Se evita la hora en punto porque GitHub la tiene saturada y ahí se atrasa o se saltea corridas.
  schedule:
    - cron: "17 9,10,11,15,18,20,23 * * *"
  # Permite tocar el botón "Run workflow" en GitHub para actualizar a mano
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar clima y noticias
        run: node scripts/update.mjs

      - name: Guardar los cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "No hay noticias nuevas, no hace falta guardar nada."
          else
            git commit -m "Actualizar clima y noticias"
            git pull --rebase origin main
            git push
          fi
